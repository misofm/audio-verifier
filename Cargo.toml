[workspace]
members = ["crates/libflac", "crates/audio-verifier", "crates/audio-verifier-enclave"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "FSL-1.1-ALv2"
publish = false
repository = "https://github.com/misofm/audio-verifier-enclave"

[workspace.dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
bcs = "0.1.6"
blake3 = "1.8.2"
cc = "1.2.62"
hex = "0.4.3"
futures-util = "0.3.31"
http-body-util = "0.1.3"
libflac = { path = "crates/libflac" }
md-5 = "0.10.6"
nautilus = { git = "https://github.com/unconfirmedlabs/nautilus-rust", rev = "46a9d27777bc749f76eb5ae1360eb77d2361a94d" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5.2", features = ["util"] }
audio-verifier = { path = "crates/audio-verifier" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.libflac]
opt-level = 3
